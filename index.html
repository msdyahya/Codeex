function localizeText(text){if(language!=='en')return text;let value=String(text).replace(/^مرحباً\s+/,'Welcome, ').replace(/^عضو منذ\s+/,'Member since ');return Object.keys(EN).sort((a,b)=>b.length-a.length).reduce((v,k)=>v.split(k).join(EN[k]),value)}
function localizeMarkup(markup){if(language!=='en')return markup;let out=String(markup).replace(/>([^<>]+)</g,(m,t)=>`>${localizeText(t)}<`);out=out.replace(/(placeholder|aria-label|title)="([^"]*)"/g,(m,k,v)=>`${k}="${localizeText(v)}"`);return out}
function setLanguage(lang,persist=true){language=lang==='en'?'en':'ar';document.documentElement.lang=language;document.documentElement.dir=language==='en'?'ltr':'rtl';document.documentElement.dataset.lang=language;if(persist)write('codna_language_v1',language);if(currentUser())renderFrame();else renderFrame()}
function visitorMarkup(){return `<section class="visitor-card"><button class="visitor-locale" data-action="toggle-language">${language==='ar'?'English':'العربية'}</button><div class="visitor-brand"><span class="brand-mark">&lt;/&gt;</span><span>Codna | كودنا</span></div><h1>${language==='ar'?'مجتمع المطورين العرب':'A Community for Arab Developers'}</h1><p>${language==='ar'?'مساحة عربية للتعلّم والتعاون ومشاركة الأفكار والمشاريع البرمجية.':'A welcoming space to learn, collaborate, and share ideas and software projects.'}</p><div class="visitor-highlights"><span>${language==='ar'?'شارك المعرفة':'Share knowledge'}</span><span>${language==='ar'?'تعلّم مع المطورين':'Learn together'}</span><span>${language==='ar'?'اعرض مشاريعك':'Showcase projects'}</span></div><div class="visitor-actions"><button class="btn primary" data-auth="register">${language==='ar'?'إنشاء حساب مجاني':'Create a free account'}</button><button class="btn" data-auth="login">${language==='ar'?'تسجيل الدخول':'Sign in'}</button></div></section>`}
function renderVisitor(){document.documentElement.dataset.authState='guest';const landing=document.querySelector('#visitorLanding');if(landing)landing.innerHTML=visitorMarkup();visitorShowing=true}
function toast(text){const t=document.querySelector('#toast');t.textContent=localizeText(text);t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2400)}
function openModal(title,body){document.querySelector('#modalTitle').textContent=localizeText(title);document.querySelector('#modalBody').innerHTML=localizeMarkup(body);document.querySelector('#modalBackdrop').classList.add('open')}
function closeModal(){document.querySelector('#modalBackdrop').classList.remove('open')}

function highlightCodeLine(line,language='javascript'){
 const keywords=new Set(('abstract as async await break case catch class const continue debugger default delete do else enum export extends finally for from function get if implements import in instanceof interface let new of package private protected public return set static super switch this throw try type typeof var void while with yield def lambda pass raise self True False None print import from as for in if elif else try except class return yield async await match case fn pub mod use impl struct enum trait mut let const static crate super return match loop while break continue fallthrough package func defer go chan select map range type var import interface nil true false null undefined NaN new throw extends constructor instanceof typeof void delete debugger with this super default export from as async await await').split(/\s+/));
 const re=/\/\/.*$|\/\*.*?\*\/|--.*$|#.*$|<!--.*?-->|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][\w$]*\b/g;
 let out='',last=0,m;
 while((m=re.exec(line))){out+=esc(line.slice(last,m.index));const t=m[0];let cls='';
  if(t.startsWith('//')||t.startsWith('/*')||t.startsWith('--')||t.startsWith('#')||t.startsWith('<!--'))cls='syn-comment';
  else if(/^['"`]/.test(t))cls='syn-string';
  else if(/^\d/.test(t))cls='syn-number';
  else if(keywords.has(t))cls='syn-key';
  else if(/[A-Za-z_$][\w$]*$/.test(t)&&/^\s*\(/.test(line.slice(re.lastIndex)))cls='syn-function';
  out+=cls?`<span class="${cls}">${esc(t)}</span>`:esc(t);last=re.lastIndex;
 }
 return out+esc(line.slice(last));
}
function codeWindow(code,language='javascript',filename='',postId=''){

}

  if(!['image/png','image/jpeg','image/webp'].includes(file.type)&&!(/\.(png|jpe?g|webp)$/i.test(file.name))){toast('اختر صورة PNG أو JPG أو WebP');input.value='';return}
  if(file.size>5*1024*1024){toast('حجم الصورة يجب أن يكون أقل من 5 ميغابايت');input.value='';return}
  const user=currentUser();if(!user){authForm('login');input.value='';return}
  try{const bitmap=await new Promise((resolve,reject)=>{const fallback=()=>{const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{URL.revokeObjectURL(url);resolve(image)};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image decoding failed'))};image.src=url};if(typeof window.createImageBitmap==='function'){window.createImageBitmap(file).then(resolve,fallback);return}fallback()});const side=320,scale=Math.min(1,side/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();const blob=typeof canvas.toBlob==='function'?await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82)):await (await fetch(canvas.toDataURL('image/jpeg',.82))).blob();if(!blob)throw new Error('Image encoding failed');const path=`avatars/${user.uid}/${Date.now()}.jpg`,fileRef=storage.ref(path);await fileRef.put(blob,{contentType:'image/jpeg'});const avatarUrl=await fileRef.getDownloadURL();await updateProfile({avatarUrl});toast('تم رفع صورة الملف إلى Firebase Storage')}
  catch(err){console.error('Codna avatar upload failed:',err);if(err?.code==='database/permission-denied')toast('رفضت قواعد Realtime Database تحديث رابط الصورة؛ انشر database.rules.json.');else if(err?.code?.startsWith('storage/'))reportFirebaseError(err);else toast('تعذرت قراءة الصورة. جرّب JPG أو PNG أو WebP أصغر من 5 ميغابايت')}
  finally{input.value=''}
 }
});
document.querySelector('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){searchTerm=e.target.value.trim();navigate('search')}});

setTheme(read('codna_html_theme_v1','light'),false);
setLanguage(language,false);
renderFrame();
initFirebaseData();
