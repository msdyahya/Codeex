function conversationMessagesRef(otherUid){const pair=[activeUser.uid,otherUid].sort();return database.ref(`conversations/${pair[0]}/${pair[1]}/messages`)}
function subscribeConversation(otherUid){if(!activeUser||!otherUid||otherUid===activeUser.uid)return;if(activeChatRef?.otherUid===otherUid){activeConversation=otherUid;return}activeConversation=otherUid;if(activeChatRef)activeChatRef.ref.off('value',activeChatRef.callback);const r=conversationMessagesRef(otherUid),fn=s=>{activeMessages=Object.entries(s.val()||{}).map(([messageId,m])=>({...m,id:messageId})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(page==='messages')renderPage()};r.on('value',fn,reportFirebaseError);activeChatRef={ref:r,callback:fn,otherUid};if(page==='messages')renderPage()}

 const re=/\/\/.*$|\/\*.*?\*\/|--.*$|#.*$|<!--.*?-->|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`|\b\d+(?:\.\d+)?\b|\b[A-Za-z_$][\w$]*\b/g;
 let out='',last=0,m;
 while((m=re.exec(line))){out+=esc(line.slice(last,m.index));const t=m[0];let cls='';
  if(t.startsWith('//')||t.startsWith('/*')||t.startsWith('--')||t.startsWith('#')||t.startsWith('<!--'))cls='syn-comment';
  else if(/^['"`]/.test(t))cls='syn-string';
  else if(/^\d/.test(t))cls='syn-number';
  else if(keywords.has(t))cls='syn-key';
  else if(/[A-Za-z_$][\w$]*$/.test(t)&&/^\s*\(/.test(line.slice(re.lastIndex)))cls='syn-function';
  out+=cls?`<span class="${cls}">${esc(t)}</span>`:esc(t);last=re.lastIndex;
 }
 return out+esc(line.slice(last));
}
function codeWindow(code,language='javascript',filename='',postId=''){
 const lang=String(language||'javascript').toLowerCase();const extMap={javascript:'js',js:'js',jsx:'jsx',typescript:'ts',ts:'ts',tsx:'tsx',python:'py',py:'py',html:'html',css:'css',json:'json',java:'java',php:'php',go:'go',rust:'rs',rs:'rs',c:'c',cpp:'cpp',csharp:'cs',sql:'sql',bash:'sh',shell:'sh'};
 const file=filename||`snippet.${extMap[lang]||'txt'}`;const raw=String(code||'').replace(/\r\n?/g,'\n').split('\n').slice(0,180);
 return `<section class="vscode-window" aria-label="مقطع كود ${esc(file)}"><div class="vs-head"><span class="vs-dots"><i></i><i></i><i></i></span><div class="vs-tab"><span class="vs-file-icon">◆</span>${esc(file)}</div><span class="vs-lang">${esc(lang)}</span>${postId?`<button class="vs-copy" data-action="copy-code" data-id="${esc(postId)}">نسخ الكود</button>`:''}</div><div class="vs-code">${raw.map((line,i)=>`<div class="vs-line"><span class="vs-no">${i+1}</span><span class="vs-src">${highlightCodeLine(line,lang)||'&nbsp;'}</span></div>`).join('')}</div></section>`;
}

ow"><span><strong>ملفي الشخصي عام</strong><small>اسمك ومساهماتك ظاهرة لأعضاء المجتمع</small></span><input class="switch" type="checkbox" checked></div></section><div class="notice-box">الصورة والمعلومات تحفظان محلياً في هذه النسخة التجريبية؛ عند ربط Firebase سننقل الصور إلى Firebase Storage.</div>`}
function renderCompose(){const user=currentUser();if(!user)return `${pageHeader('المشاركة في كودنا','سجّل الدخول أولاً لتتمكن من النشر.','')}<div class="panel empty-state"><b>تحتاج إلى حساب للمشاركة</b><button class="btn primary" data-auth="register">إنشاء حساب</button></div>`;return `${pageHeader('إنشاء مشاركة','شارك سؤالاً أو مقالة أو فكرة مع المطورين العرب.','')}<section class="panel"><form class="form-grid" id="publishForm"><label>نوع المشاركة<select class="field" id="publishKind"><option>نقاش</option><option>سؤال</option><option>مقالة</option><option>مورد</option><option>مشروع</option></select></label><label>العنوان (اختياري للنقاش)<input class="field" id="publishTitle" maxlength="120" placeholder="عنوان واضح ومفيد"></label><label>التفاصيل<textarea class="field" id="publishText" maxlength="4000" placeholder="اكتب ما تريد مشاركته..." required></textarea></label><div><strong style="display:block;font-size:12px;color:#67758b">مقطع كود (اختياري)</strong><div style="display:flex;gap:8px;align-items:center;margin:5px 0 8px"><select class="field" id="publishLanguage" style="margin:0;max-width:180px"><option value="javascript">JavaScript</option><option value="typescript">TypeScript</option><option value="python">Python</option><option value="html">HTML</option><option value="css">CSS</option><option value="json">JSON</option><option value="java">Java</option><option value="php">PHP</option><option value="go">Go</option><option value="rust">Rust</option><option value="sql">SQL</option><option value="bash">Bash</option></select><label class="btn small" for="codeFile">اختيار ملف كود</label><input id="codeFile" type="file" accept=".js,.jsx,.ts,.tsx,.py,.html,.css,.json,.java,.php,.go,.rs,.c,.cpp,.cs,.sql,.sh,.txt" hidden></div><input id="codeFilename" type="hidden"><textarea class="code-editor" id="publishCode" maxlength="20000" placeholder="الصق الكود هنا أو اختر ملفاً من جهازك"></textarea><small class="muted">سيظهر المنشور داخل محرر منسق يشبه VS Code.</small></div><label>وسوم مفصولة بفاصلة<input class="field" id="publishTags" placeholder="React, JavaScript"></label><div class="modal-actions"><button class="btn" type="button" data-page="home">إلغاء</button><button class="btn primary" type="submit">نشر المشاركة</button></div></form></section>`}
function renderPlayground(){return `${pageHeader('مساحة الأكواد','اكتب مقطعاً وجرب محرر الواجهة. التشغيل هنا محاكاة آمنة فقط.','')}<section class="panel" style="padding:15px"><div class="panel-head" style="padding:0 0 10px"><h3>محرر JavaScript</h3><span class="pill">تجريبي</span></div><textarea class="code-editor" id="playCode">console.log('مرحباً بك في كودنا!');
const community = 'المطورون العرب';
console.log(community);</textarea><div style="display:flex;justify-content:flex-start;gap:8px;margin-top:11px"><button class="btn primary" data-action="run-code">▶ تشغيل تجريبي</button><button class="btn" data-action="clear-code">مسح</button></div><div class="divider"></div><b style="font-size:12px">النتيجة</b><pre id="runOutput" class="code-block" style="min-height:58px;white-space:pre-wrap">ستظهر النتيجة هنا بعد الضغط على تشغيل.</pre><div class="notice-box">هذه المعاينة لا تنفذ شيفرة المستخدم فعلياً. خدمة التشغيل الحقيقية يجب أن تكون معزولة على خادم مستقل.</div></section>`}
function renderSearch(){const arr=allPosts();return `${pageHeader(`نتائج البحث: ${esc(searchTerm)}`,'المنشورات المطابقة في مجتمع كودنا.','')} ${arr.length?arr.map(postCard).join(''):'<div class="panel empty-state"><b>لم نجد نتائج</b>جرّب كلمات بحث مختلفة.</div>'}`}
function renderPage(){const view=document.querySelector('#pageView');if(page==='home')view.innerHTML=feed();else if(page==='questions')view.innerHTML=renderQuestions();else if(page==='articles')view.innerHTML=renderArticles();else if(page==='groups')view.innerHTML=renderGroups();else if(page==='events')view.innerHTML=renderEvents();else if(page==='projects')view.innerHTML=renderProjects();else if(page==='resources')view.innerHTML=renderResources();else if(page==='notifications')view.innerHTML=renderNotifications();else if(page==='messages')view.innerHTML=renderMessages();else if(page==='saved')view.innerHTML=renderSaved();else if(page==='profile')view.innerHTML=renderProfile();else if(page==='settings')view.innerHTML=renderSettings();else if(page==='compose')view.innerHTML=renderCompose();else if(page==='playground')view.innerHTML=renderPlayground();else if(page==='search')view.innerHTML=renderSearch();else view.innerHTML=feed();}
function navigate(id){page=id;renderFrame();window.scrollTo({top:0,behavior:'smooth'})}
function authForm(mode){const isRegister=mode==='register';openModal(isRegister?'إنشاء حساب في كودنا':'تسجيل الدخول',`<div class="form-grid" style="padding:0"><button type="button" class="btn" data-auth="google">المتابعة باستخدام Google</button><div class="divider"></div><form id="authForm" class="form-grid" style="padding:0">${isRegister?'<label>الاسم الظاهر<input class="field" id="authName" required minlength="2" maxlength="50"></label>':''}<label>البريد الإلكتروني<input class="field" id="authEmail" type="email" required autocomplete="email"></label><label>كلمة المرور<input class="field" id="authPassword" type="password" required minlength="8" autocomplete="${isRegister?'new-password':'current-password'}"></label><p class="muted" style="font-size:11px;margin:0">سيتم إنشاء حساب حقيقي عبر Firebase Authentication.</p><div id="authError" style="color:var(--red);font-size:12px"></div><button class="btn primary" type="submit">${isRegister?'إنشاء الحساب':'دخول'}</button><button type="button" class="btn ghost" data-auth="${isRegister?'login':'register'}">${isRegister?'لديك حساب؟ سجّل الدخول':'مستخدم جديد؟ أنشئ حساباً'}</button></form></div>`)}
function requireUser(){if(!currentUser()){authForm('login');return false}return true}
async function savePost(p){const prior=cloudPosts;cloudPosts=[p,...cloudPosts.filter(x=>x.id!==p.id)];try{await publishPost(p);return true}catch(e){cloudPosts=prior;reportFirebaseError(e);return false}}
document.addEventListener('click',async e=>{
 const pageEl=e.target.closest('[data-page]');if(pageEl){const id=pageEl.dataset.page;if(id==='login'||id==='register'){authForm(id);return}if(id==='compose'&&pageEl.dataset.kind)window.pendingKind=pageEl.dataset.kind;navigate(id);if(id==='compose'&&window.pendingKind){const sel=document.querySelector('#publishKind');if(sel)sel.value=window.pendingKind==='project'?'مشروع':window.pendingKind==='article'?'مقالة':window.pendingKind==='question'?'سؤال':window.pendingKind==='resource'?'مورد':'نقاش'}return}
 const auth=e.target.closest('[data-auth]');if(auth){if(auth.dataset.auth==='logout'){firebase.auth().signOut().catch(reportFirebaseError)}else if(auth.dataset.auth==='google')signInGoogle();else authForm(auth.dataset.auth);return}
 if(e.target.closest('[data-close-modal]')){closeModal();return}
 const act=e.target.closest('[data-action]');if(!act)return;const action=act.dataset.action;
 if(action==='toggle-theme'){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');toast(document.documentElement.dataset.theme==='dark'?'تم تفعيل الوضع الليلي':'تم تفعيل الوضع الفاتح');return}
 if(action==='profile-tab'){profileTab=act.dataset.tab;renderPage();return}
 if(action==='filter'){feedFilter=act.dataset.filter;renderPage();return}
 if(action==='tag'){searchTerm=act.dataset.tag;document.querySelector('#searchInput').value=searchTerm;navigate('search');return}
 if(action==='join'){if(!requireUser())return;const ids=DEMO.joined(),i=ids.indexOf(act.dataset.id);i<0?ids.push(act.dataset.id):ids.splice(i,1);DEMO.setJoined(ids);renderFrame();toast(i<0?'انضممت إلى المجموعة':'غادرت المجموعة');return}
 if(action==='like'){if(!requireUser())return;const p=DEMO.posts().find(x=>x.id===act.dataset.id);if(!p)return;const who=currentUser().uid;if(!remoteRawPosts[p.id]?.data){toast('هذا نموذج عرض فقط؛ تفاعل مع منشور منشور على Firebase.');return}const was=(p.likedBy||[]).includes(who);database.ref(`posts/${p.id}/reactions/${who}`).set(was?null:true).then(()=>{if(!was&&p.uid!==who)addNotification(p.uid,{postId:p.id,type:'like',text:`أعجب ${currentUser().name} بمنشورك.`}).catch(reportFirebaseError)}).catch(reportFirebaseError);p.likedBy=p.likedBy||[];was?p.likedBy=p.likedBy.filter(x=>x!==who):p.likedBy.push(who);p.likes=p.likedBy.length;renderPage();return}
 if(action==='save'){if(!requireUser())return;const p=DEMO.posts().find(x=>x.id===act.dataset.id);if(!p)return;let ids=DEMO.saved();const i=ids.indexOf(p.id);i>=0?ids.splice(i,1):ids.push(p.id);DEMO.setSaved(ids);renderPage();toast(i>=0?'أزل من المحفوظات':'أضيف إلى المحفوظات');return}
 if(action==='comment'){if(!requireUser())return;const p=DEMO.posts().find(x=>x.id===act.dataset.id);if(!p)return;openModal('التعليقات',`<div>${(p.comments||[]).map(c=>`<div class="comment"><b>${esc(c.name)}:</b> ${esc(c.text)}</div>`).join('')||'<p class="muted">لا توجد تعليقات بعد.</p>'}<form id="commentForm"><input type="hidden" id="commentPostId" value="${esc(p.id)}"><input class="field" id="commentText" maxlength="400" placeholder="أضف تعليقاً..." required><div class="modal-actions"><button class="btn primary" type="submit">إرسال التعليق</button></div></form></div>`);return}
 if(action==='expand'||action==='read-post'){const p=DEMO.posts().find(x=>x.id===act.dataset.id);if(!p)return;openModal(p.title||'تفاصيل المشاركة',`<div class="post-header"><span class="avatar ${esc(p.tone||'blue')}">${esc(p.avatar||p.name[0])}</span><div class="post-ident"><strong>${esc(p.name)}</strong><div class="post-meta">${timeAgo(p.createdAt)}</div></div></div><p class="post-text">${esc(p.text)}</p>${p.code?codeWindow(p.code,p.codeLanguage,p.fileName,p.id):''}<div class="post-tags">${(p.tags||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div><div class="divider"></div><p class="muted">${(p.comments||[]).length} تعليق · ${p.likes||0} إعجاب</p>`);return}
 if(action==='copy-code'){const post=DEMO.posts().find(x=>x.id===act.dataset.id);if(!post?.code)return;try{await navigator.clipboard.writeText(post.code);toast('تم نسخ الكود')}catch{const area=document.createElement('textarea');area.value=post.code;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();toast('تم نسخ الكود')}return}
 if(action==='share'){const u=location.href.split('#')[0]+'#'+act.dataset.id;if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('تم نسخ رابط المشاركة')).catch(()=>toast('انسخ رابط الصفحة للمشاركة'));else toast('تم تجهيز رابط المشاركة');return}
 if(action==='post-menu'){openModal('خيارات المنشور',`<div class="form-grid" style="padding:0"><button class="btn" data-action="save" data-id="${esc(act.dataset.id)}">${icon('bookmark')} حفظ المنشور</button><button class="btn danger" data-action="report" data-id="${esc(act.dataset.id)}">الإبلاغ عن المنشور</button></div>`);return}
 if(action==='report'){if(!requireUser())return;const postId=act.dataset.id;database.ref('reports').push({reporterUid:currentUser().uid,postId,createdAt:Date.now()}).then(()=>{closeModal();toast('تم إرسال البلاغ للمراجعة')}).catch(reportFirebaseError);return}
 if(action==='new-group'){if(!requireUser())return;openModal('إنشاء مجموعة',`<form id="groupForm" class="form-grid" style="padding:0"><label>اسم المجموعة<input class="field" id="groupName" required maxlength="60"></label><label>وصف مختصر<textarea class="field" id="groupDesc" maxlength="250"></textarea></label><button class="btn primary" type="submit">إنشاء المجموعة</button></form>`);return}
 if(action==='event'){if(!requireUser())return;const ids=DEMO.events(),id=String(act.dataset.id);ids.includes(id)?eventIds=ids.filter(x=>x!==id):eventIds=[...ids,id];DEMO.setEvents(eventIds);renderPage();toast('تم حفظ التسجيل على Firebase');return}
 if(action==='read-all'){if(!requireUser())return;DEMO.setNotices(DEMO.notices().map(n=>({...n,read:true})));renderPage();toast('تم تحديد الإشعارات كمقروءة');return}
 if(action==='conversation'){subscribeConversation(act.dataset.id);return}
 if(action==='run-code'){document.querySelector('#runOutput').textContent='مرحباً بك في كودنا!\nالمطورون العرب';return}
 if(action==='clear-code'){document.querySelector('#playCode').value='';document.querySelector('#runOutput').textContent='تم مسح المحرر.';return}
 if(action==='resource'){toast('ستضاف تفاصيل المسار عند ربط قاعدة البيانات');return}
 if(action==='support'){openModal('ادعم كودنا','<p class="muted">شكراً لاهتمامك بدعم المجتمع. خيارات الدعم ستتاح عند اكتمال إعداد المنصة.</p>');return}
 if(action==='sort-questions'){questionSort=act.textContent.includes('بدون')?'unanswered':'popular';renderPage();return}
});
document.addEventListener('submit',async e=>{
 if(e.target.id==='authForm'){e.preventDefault();const email=document.querySelector('#authEmail').value.trim().toLowerCase(),password=document.querySelector('#authPassword').value;try{if(document.querySelector('#authName')){const name=document.querySelector('#authName').value.trim();const credential=await auth.createUserWithEmailAndPassword(email,password);await credential.user.updateProfile({displayName:name});const profile={uid:credential.user.uid,name,handle:email.split('@')[0].replace(/[^a-z0-9_]/gi,'_'),bio:'',avatarUrl:'',joinedAt:Date.now(),followers:0};await database.ref(`profiles/${credential.user.uid}`).set(profile);activeUser={...profile,email};syncUserState(credential.user.uid)}else{await auth.signInWithEmailAndPassword(email,password)}closeModal();renderFrame();toast('تم تسجيل الدخول بنجاح')}catch(err){reportFirebaseError(err)}}
 if(e.target.id==='publishForm'){e.preventDefault();if(!requireUser())return;const user=currentUser(),kind=document.querySelector('#publishKind').value,text=document.querySelector('#publishText').value.trim();if(!text)return;if(!await savePost({id:uid(),uid:user.uid,name:user.name,handle:user.handle,avatar:user.name[0],avatarUrl:user.avatarUrl||'',tone:'blue',kind,title:document.querySelector('#publishTitle').value.trim(),text,code:document.querySelector('#publishCode').value.trim(),codeLanguage:document.querySelector('#publishLanguage').value,fileName:document.querySelector('#codeFilename').value.trim(),tags:document.querySelector('#publishTags').value.split(/[,،]/).map(x=>x.trim().replace(/^#/,'')).filter(Boolean).slice(0,5),likes:0,comments:[],likedBy:[],savedBy:[],createdAt:Date.now()}))return;closeModal();searchTerm='';feedFilter='الأحدث';navigate('home');toast('تم نشر المشاركة على Firebase')}
 if(e.target.id==='commentForm'){e.preventDefault();const id=document.querySelector('#commentPostId').value,text=document.querySelector('#commentText').value.trim();try{await addComment(id,text);closeModal();toast('تم نشر التعليق على Firebase')}catch(err){reportFirebaseError(err)}}
 if(e.target.id==='groupForm'){e.preventDefault();const name=document.querySelector('#groupName').value.trim();if(!currentUser())return;const id=uid(),description=document.querySelector('#groupDesc').value.trim(),g={id,name,description,members:'1 عضو',icon:'⌘',tone:'teal',ownerUid:currentUser().uid,createdAt:Date.now()};database.ref(`groups/${id}`).set(g).then(()=>{closeModal();toast('تم إنشاء المجموعة على Firebase')}).catch(reportFirebaseError)}
 if(e.target.id==='chatForm'){e.preventDefault();const field=document.querySelector('#chatInput'),text=field.value.trim(),other=e.target.dataset.to;if(!requireUser()||!text||!other)return;try{await conversationMessagesRef(other).push({uid:currentUser().uid,text,createdAt:Date.now()});field.value=''}catch(err){reportFirebaseError(err)}}
 if(e.target.id==='profileForm'){e.preventDefault();const user=currentUser();if(!user){authForm('login');return}const name=document.querySelector('#settingsName').value.trim(),handle=document.querySelector('#settingsHandle').value.trim(),bio=document.querySelector('#settingsBio').value.trim();try{await updateProfile({name,handle,bio});toast('تم حفظ الملف الشخصي على Firebase')}catch(err){reportFirebaseError(err)}}
});
document.querySelector('#pageView').addEventListener('change',async e=>{
 const input=e.target;if(!input.files?.[0])return;const file=input.files[0];
 if(input.id==='codeFile'){
  if(file.size>20000){toast('الحد الأقصى لحجم ملف الكود 20 كيلوبايت');input.value='';return}
  const ext=(file.name.split('.').pop()||'').toLowerCase();const langs={js:'javascript',jsx:'jsx',ts:'typescript',tsx:'tsx',py:'python',html:'html',css:'css',json:'json',java:'java',php:'php',go:'go',rs:'rust',c:'c',cpp:'cpp',cs:'csharp',sql:'sql',sh:'bash'};
  try{document.querySelector('#publishCode').value=await file.text();document.querySelector('#codeFilename').value=file.name;const select=document.querySelector('#publishLanguage');if(langs[ext])select.value=langs[ext];toast(`تم تحميل ${file.name}؛ سيُحفظ محتواه مع المنشور على Firebase`)}catch{toast('تعذر قراءة الملف المحدد')}
  return;
 }
 if(input.id==='profileAvatar'||input.id==='settingsAvatar'){
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('اختر صورة PNG أو JPG أو WebP');input.value='';return}
  if(file.size>5*1024*1024){toast('حجم الصورة يجب أن يكون أقل من 5 ميغابايت');input.value='';return}
  const user=currentUser();if(!user){authForm('login');input.value='';return}
  try{const bitmap=await createImageBitmap(file);const side=320,scale=Math.min(1,side/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();const blob=await (await fetch(canvas.toDataURL('image/jpeg',.82))).blob(),path=`avatars/${user.uid}/${Date.now()}.jpg`,fileRef=storage.ref(path);await fileRef.put(blob,{contentType:'image/jpeg'});const avatarUrl=await fileRef.getDownloadURL();await updateProfile({avatarUrl});toast('تم رفع صورة الملف إلى Firebase Storage')}
  catch{toast('تعذر معالجة الصورة؛ جرّب ملفاً بصيغة PNG أو JPG')}
 }
});
document.querySelector('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){searchTerm=e.target.value.trim();navigate('search')}});
document.querySelector('#searchInput').addEventListener('input',e=>{if(!e.target.value.trim()&&page==='search'){searchTerm='';navigate('home')}});
document.querySelector('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
setTheme(read('codna_html_theme_v1','light'),false);
renderFrame();
initFirebaseData();
})();
</script>
